<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listas</title>
</head>
<body>
    <!-- Lista não ordenada -->
    <h3> Lista de Compras</h3>
    <ul>
        <li>Banana</li>
        <li>Laranja</li>
        <li>Morango</li>
        <li>Uva</li>
    </ul>
    
    <!-- Lista ordenada -->
    <h3> Lista de Nomes</h3>
    <ol>
        <li>Ivyson</li>
        <li>Thauan</li>
        <li>Nunes</li>
    </ol>

    <br>

    <h3>Exercicio: Lista dentro de Lista</h3>
    <ol>
        <li>
            Ivyson
            <ul>
                <li>Desenvolvesor Back-end</li>
            </ul>
        </li>

        <li>
            Carlos
            <ul>
                <li>Desenvolvesor Front-end</li>
            </ul>
        </li>

        <li>
            Felipe
            <ul>
                <li>QA</li>
            </ul>
        </li>
    </ol>
</body>
</html>
